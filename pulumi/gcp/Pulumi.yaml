name: ripty-station-gcp
runtime: yaml
description: >-
  Ripty Station on one Compute Engine instance in a new network. The instance installs the Station
  from your Headquarters at its first boot, starts it and enrolls it with the join token. It makes
  the same Station as deploy/aws/ripty-connector.yaml (CloudFormation). Add Station in
  Headquarters prints the `pulumi config set` command for every Headquarters value below. Also
  run `pulumi config set gcp:project <your project id>`.

config:
  # The Station address of Headquarters, for example https://203.0.113.7:12199. The instance must
  # be able to resolve and dial it.
  consoleUrl:
    type: string
  # The join token from Add Station (rtt_ plus 43 characters). It works once and expires after one
  # day. Set it with `pulumi config set joinToken <token> --secret`.
  joinToken:
    type: string
    secret: true
  # The certificate pin from Add Station (sha256: plus 64 hex digits). Leave empty when the
  # Station address of Headquarters has a public certificate. Set it together with consoleSpki.
  consolePin:
    type: string
    default: ""
  # The public key pin from Add Station (sha256// plus 43 characters and an equals sign). Leave
  # empty when consolePin is empty. Set it together with consolePin.
  consoleSpki:
    type: string
    default: ""
  # Optional. A callback zone, for example oob.example.com. When set, the Station also answers DNS
  # for that zone (it needs port 53, which the firewall opens to allowedCidr).
  dnsZone:
    type: string
    default: ""
  # The Google Cloud region. The instance goes in the first zone of that region that is up (not
  # every region has a zone "a": us-east1 has b, c and d).
  region:
    type: string
    default: us-central1
  # An x86_64 machine type with at least 2 GB of memory. The Station binary is linux-x64 only, so
  # there are no Arm types.
  instanceSize:
    type: string
    default: e2-small
  # Optional. An SSH public key line. When set, the instance adds it to the user ubuntu (made if
  # missing, in the sudo group). Port 22 opens only to sshCidr.
  sshPublicKey:
    type: string
    default: ""
  # Who may reach the Meeting Sites on ports 80, 8080 and 8000 and the Signal Sites on 22000 (ssh)
  # and 33890 (RDP). The default faces whoever can reach the host, like a default install. For an
  # internal deception host, narrow it to your internal ranges.
  allowedCidr:
    type: string
    default: 0.0.0.0/0
  # The range allowed to SSH in (port 22). The default is the documentation address 192.0.2.1,
  # which nobody connects from, so port 22 stays closed until you set a range.
  sshCidr:
    type: string
    default: 192.0.2.1/32

variables:
  # The zones of the region that are up. Not every region has a zone "a" (us-east1: b, c and d).
  zones:
    fn::invoke:
      function: gcp:compute:getZones
      arguments:
        region: ${region}
        status: UP

resources:
  network:
    type: gcp:compute:Network
    properties:
      autoCreateSubnetworks: true
      description: Ripty Station network

  # A firewall name must be lowercase (a-z, 0-9, hyphens), and the engine's automatic name keeps
  # the capitals of the resource name (firewallSites-1a2b3c4), which Google Cloud rejects. A
  # firewall name is also unique in the whole project, so the name starts from the network's
  # automatic name: a second stack in the same project gets its own.
  firewallSites:
    type: gcp:compute:Firewall
    properties:
      name: ${network.name}-sites
      network: ${network.selfLink}
      description: "Ripty Station: Meeting Sites on 80, 8080 and 8000, Signal Sites on 22000 and 33890"
      direction: INGRESS
      sourceRanges:
        - ${allowedCidr}
      targetTags:
        - ripty-station
      allows:
        - protocol: tcp
          ports: ["80", "8080", "8000", "22000", "33890"]

  firewallDns:
    type: gcp:compute:Firewall
    properties:
      name: ${network.name}-dns
      network: ${network.selfLink}
      description: "Ripty Station: DNS for a callback zone (nothing listens unless dnsZone is set)"
      direction: INGRESS
      sourceRanges:
        - ${allowedCidr}
      targetTags:
        - ripty-station
      allows:
        - protocol: tcp
          ports: ["53"]
        - protocol: udp
          ports: ["53"]

  firewallSsh:
    type: gcp:compute:Firewall
    properties:
      name: ${network.name}-ssh
      network: ${network.selfLink}
      description: "Ripty Station: SSH from sshCidr"
      direction: INGRESS
      sourceRanges:
        - ${sshCidr}
      targetTags:
        - ripty-station
      allows:
        - protocol: tcp
          ports: ["22"]

  station:
    type: gcp:compute:Instance
    properties:
      machineType: ${instanceSize}
      zone: ${zones.names[0]}
      tags:
        - ripty-station
      labels:
        app: ripty-station
      bootDisk:
        initializeParams:
          image: ubuntu-os-cloud/ubuntu-2404-lts-amd64
          size: 20
          type: pd-balanced
      networkInterfaces:
        - network: ${network.selfLink}
          accessConfigs:
            - {}
      # Compute Engine runs this script at every boot; the marker file below makes it run once.
      metadataStartupScript: |
        #!/bin/bash
        # Installs the Station from Headquarters and enrolls it. The log is /var/log/ripty-install.log.
        # The values come from your own stack config and sit in single quotes below, so a value must
        # hold no quote. The join token is a Pulumi secret: the state stores this script encrypted.
        [ -e /var/lib/ripty-install.done ] && exit 0
        (umask 077; : >>/var/log/ripty-install.log)
        exec >>/var/log/ripty-install.log 2>&1
        echo "ripty-install: start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        CONSOLE_URL='${consoleUrl}'
        JOIN_TOKEN='${joinToken}'
        CONSOLE_PIN='${consolePin}'
        CONSOLE_SPKI='${consoleSpki}'
        DNS_ZONE='${dnsZone}'
        SSH_PUBLIC_KEY='${sshPublicKey}'
        if [ -n "$SSH_PUBLIC_KEY" ]; then
          id ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo ubuntu
          install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" >>/home/ubuntu/.ssh/authorized_keys
          chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
          chmod 600 /home/ubuntu/.ssh/authorized_keys
        fi
        url_re='^https://[]A-Za-z0-9._~:/[-]*[]A-Za-z0-9._~:[-]$'
        token_re='^rtt_[A-Za-z0-9_-]{43}$'
        if ! [[ "$CONSOLE_URL" =~ $url_re ]]; then
          echo "ripty-install: consoleUrl must be an https address with no trailing slash"
          exit 2
        fi
        if ! [[ "$JOIN_TOKEN" =~ $token_re ]]; then
          echo "ripty-install: joinToken must be rtt_ followed by 43 letters, digits, underscores or hyphens"
          exit 2
        fi
        if [ -n "$CONSOLE_PIN" ] && [ -z "$CONSOLE_SPKI" ]; then
          echo "ripty-install: consolePin needs consoleSpki too (copy both from Add Station)"
          exit 2
        fi
        if [ -z "$CONSOLE_PIN" ] && [ -n "$CONSOLE_SPKI" ]; then
          echo "ripty-install: consoleSpki needs consolePin too (copy both from Add Station)"
          exit 2
        fi
        set -- --role connector --hq-url "$CONSOLE_URL" --join-token "$JOIN_TOKEN"
        PIN_OPTS=""
        if [ -n "$CONSOLE_PIN" ]; then
          set -- "$@" --hq-pin "$CONSOLE_PIN" --hq-spki "$CONSOLE_SPKI"
          PIN_OPTS="-k --pinnedpubkey $CONSOLE_SPKI"
        fi
        if [ -n "$DNS_ZONE" ]; then
          set -- "$@" --dns-zone "$DNS_ZONE"
        fi
        INSTALLER=/root/ripty-install.sh
        # The token goes to curl on its stdin, so it is on no command line. A cut transfer
        # (curl exit 18 or 56, which --retry does not retry) leaves a partial file, so curl's
        # exit status is checked as well as the file.
        if ! printf 'Authorization: Bearer %s\n' "$JOIN_TOKEN" | curl -fsS --retry 5 --retry-delay 10 --retry-connrefused $PIN_OPTS -H @- -o "$INSTALLER" "$CONSOLE_URL/connector/v1/install.sh" || [ ! -s "$INSTALLER" ]; then
          rm -f "$INSTALLER"
          echo "ripty-install: could not fetch the installer from $CONSOLE_URL/connector/v1/install.sh"
          exit 24
        fi
        bash "$INSTALLER" "$@"
        STATUS=$?
        rm -f "$INSTALLER"
        echo "ripty-install: installer exit $STATUS"
        [ "$STATUS" -eq 0 ] && touch /var/lib/ripty-install.done
        exit $STATUS
    options:
      # A new join token makes a new Station, so a changed script replaces the instance.
      replaceOnChanges:
        - metadataStartupScript

outputs:
  instanceId: ${station.instanceId}
  privateIp: ${station.networkInterfaces[0].networkIp}
  publicIp: ${station.networkInterfaces[0].accessConfigs[0].natIp}
