name: ripty-station-aws
runtime: yaml
description: >-
  Ripty Station on one EC2 instance in your default VPC. The instance installs the Station from
  your Headquarters, starts it and enrolls it with the join token. It makes the same Station as
  deploy/aws/ripty-connector.yaml (CloudFormation). Add Station in Headquarters prints the
  `pulumi config set` command for every required value below.

config:
  # The Station address of Headquarters, for example https://203.0.113.7:12199. The instance must
  # be able to resolve and dial it.
  consoleUrl:
    type: string
  # The join token from Add Station (rtt_ plus 43 characters). It works once and expires after one
  # day. Set it with `pulumi config set joinToken <token> --secret`.
  joinToken:
    type: string
    secret: true
  # The certificate pin from Add Station (sha256: plus 64 hex digits). Leave empty when the
  # Station address of Headquarters has a public certificate. Set it together with consoleSpki.
  consolePin:
    type: string
    default: ""
  # The public key pin from Add Station (sha256// plus 43 characters and an equals sign). Leave
  # empty when consolePin is empty. Set it together with consolePin.
  consoleSpki:
    type: string
    default: ""
  # Optional. A callback zone, for example oob.example.com. When set, the Station also answers DNS
  # for that zone (it needs port 53, which the security group opens to allowedCidr).
  dnsZone:
    type: string
    default: ""
  # The AWS region. The instance goes in a default subnet of the default VPC (the first one the
  # API lists).
  region:
    type: string
    default: us-east-1
  # An x86_64 instance type with at least 2 GiB of memory. The Station binary is linux-x64 only,
  # so there are no Graviton types.
  instanceSize:
    type: string
    default: t3.small
  # Optional. An SSH public key line. When set, the instance adds it to the ubuntu user. Port 22
  # opens only to sshCidr.
  sshPublicKey:
    type: string
    default: ""
  # Who may reach the Meeting Sites on ports 80, 8080 and 8000 and the Signal Sites on 22000 (ssh)
  # and 33890 (RDP). The default faces whoever can reach the host, like a default install. For an
  # internal deception host, narrow it to your internal ranges.
  allowedCidr:
    type: string
    default: 0.0.0.0/0
  # The range allowed to SSH in (port 22). The default is the documentation address 192.0.2.1,
  # which nobody connects from, so port 22 stays closed until you set a range.
  sshCidr:
    type: string
    default: 192.0.2.1/32

variables:
  # The Ubuntu 24.04 LTS AMI, read from Canonical's public SSM parameter (as the CloudFormation template does).
  ami:
    fn::invoke:
      function: aws:ssm:getParameter
      arguments:
        name: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
      return: value
      options:
        provider: ${awsProvider}
  defaultVpc:
    fn::invoke:
      function: aws:ec2:getVpc
      arguments:
        default: true
      options:
        provider: ${awsProvider}
  # The default subnets of the default VPC (one per zone that has one). The first one is used: an
  # account may have no default subnet in a given zone, so no zone is named here.
  subnets:
    fn::invoke:
      function: aws:ec2:getSubnets
      arguments:
        filters:
          - name: vpc-id
            values:
              - ${defaultVpc.id}
          - name: default-for-az
            values:
              - "true"
      options:
        provider: ${awsProvider}

resources:
  awsProvider:
    type: pulumi:providers:aws
    properties:
      region: ${region}

  securityGroup:
    type: aws:ec2:SecurityGroup
    properties:
      description: "Ripty Station: Meeting Sites and Signal Sites, DNS for a callback zone, and SSH from sshCidr"
      vpcId: ${defaultVpc.id}
      ingress:
        - {protocol: tcp, fromPort: 80, toPort: 80, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 8080, toPort: 8080, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 8000, toPort: 8000, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 22000, toPort: 22000, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 33890, toPort: 33890, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 53, toPort: 53, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: udp, fromPort: 53, toPort: 53, cidrBlocks: ["${allowedCidr}"]}
        - {protocol: tcp, fromPort: 22, toPort: 22, cidrBlocks: ["${sshCidr}"]}
      egress:
        - {protocol: "-1", fromPort: 0, toPort: 0, cidrBlocks: ["0.0.0.0/0"]}
      tags:
        Name: ripty-station
    options:
      provider: ${awsProvider}

  station:
    type: aws:ec2:Instance
    properties:
      ami: ${ami}
      instanceType: ${instanceSize}
      subnetId: ${subnets.ids[0]}
      vpcSecurityGroupIds:
        - ${securityGroup.id}
      associatePublicIpAddress: true
      metadataOptions:
        httpTokens: required
      rootBlockDevice:
        volumeType: gp3
        volumeSize: 20
        deleteOnTermination: true
      tags:
        Name: ripty-station
      # A new join token makes a new Station, so a changed script replaces the instance.
      userDataReplaceOnChange: true
      userData: |
        #!/bin/bash
        # Installs the Station from Headquarters and enrolls it. The log is /var/log/ripty-install.log.
        # The values come from your own stack config and sit in single quotes below, so a value must
        # hold no quote. The join token is a Pulumi secret: the state stores this script encrypted.
        (umask 077; : >>/var/log/ripty-install.log)
        exec >>/var/log/ripty-install.log 2>&1
        echo "ripty-install: start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        CONSOLE_URL='${consoleUrl}'
        JOIN_TOKEN='${joinToken}'
        CONSOLE_PIN='${consolePin}'
        CONSOLE_SPKI='${consoleSpki}'
        DNS_ZONE='${dnsZone}'
        SSH_PUBLIC_KEY='${sshPublicKey}'
        if [ -n "$SSH_PUBLIC_KEY" ]; then
          install -d -m 700 -o ubuntu -g ubuntu /home/ubuntu/.ssh
          printf '%s\n' "$SSH_PUBLIC_KEY" >>/home/ubuntu/.ssh/authorized_keys
          chown ubuntu:ubuntu /home/ubuntu/.ssh/authorized_keys
          chmod 600 /home/ubuntu/.ssh/authorized_keys
        fi
        url_re='^https://[]A-Za-z0-9._~:/[-]*[]A-Za-z0-9._~:[-]$'
        token_re='^rtt_[A-Za-z0-9_-]{43}$'
        if ! [[ "$CONSOLE_URL" =~ $url_re ]]; then
          echo "ripty-install: consoleUrl must be an https address with no trailing slash"
          exit 2
        fi
        if ! [[ "$JOIN_TOKEN" =~ $token_re ]]; then
          echo "ripty-install: joinToken must be rtt_ followed by 43 letters, digits, underscores or hyphens"
          exit 2
        fi
        if [ -n "$CONSOLE_PIN" ] && [ -z "$CONSOLE_SPKI" ]; then
          echo "ripty-install: consolePin needs consoleSpki too (copy both from Add Station)"
          exit 2
        fi
        if [ -z "$CONSOLE_PIN" ] && [ -n "$CONSOLE_SPKI" ]; then
          echo "ripty-install: consoleSpki needs consolePin too (copy both from Add Station)"
          exit 2
        fi
        set -- --role connector --hq-url "$CONSOLE_URL" --join-token "$JOIN_TOKEN"
        PIN_OPTS=""
        if [ -n "$CONSOLE_PIN" ]; then
          set -- "$@" --hq-pin "$CONSOLE_PIN" --hq-spki "$CONSOLE_SPKI"
          PIN_OPTS="-k --pinnedpubkey $CONSOLE_SPKI"
        fi
        if [ -n "$DNS_ZONE" ]; then
          set -- "$@" --dns-zone "$DNS_ZONE"
          # A cloud host answers with its private address unless it is told its public one.
          MD_TOKEN=$(curl -fsS --max-time 5 -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)
          ANSWER_IP=$(curl -fsS --max-time 5 -H "X-aws-ec2-metadata-token: $MD_TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4)
          if printf '%s' "$ANSWER_IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
            set -- "$@" --dns-answer-ip "$ANSWER_IP"
          fi
        fi
        INSTALLER=/root/ripty-install.sh
        # The token goes to curl on its stdin, so it is on no command line. A cut transfer
        # (curl exit 18 or 56, which --retry does not retry) leaves a partial file, so curl's
        # exit status is checked as well as the file.
        if ! printf 'Authorization: Bearer %s\n' "$JOIN_TOKEN" | curl -fsS --retry 5 --retry-delay 10 --retry-connrefused $PIN_OPTS -H @- -o "$INSTALLER" "$CONSOLE_URL/connector/v1/install.sh" || [ ! -s "$INSTALLER" ]; then
          rm -f "$INSTALLER"
          echo "ripty-install: could not fetch the installer from $CONSOLE_URL/connector/v1/install.sh"
          exit 24
        fi
        bash "$INSTALLER" "$@"
        STATUS=$?
        rm -f "$INSTALLER"
        echo "ripty-install: installer exit $STATUS"
        exit $STATUS
    options:
      provider: ${awsProvider}
      # The ami variable is read from Canonical's SSM parameter on every `pulumi up`, and a new AMI
      # replaces the instance. The replacement would boot this script with a join token that the first
      # enrollment spent, so the Station would be gone. Ignore the AMI, as Terraform does.
      ignoreChanges:
        - ami

outputs:
  instanceId: ${station.id}
  privateIp: ${station.privateIp}
  publicIp: ${station.publicIp}
